[project]
name = "fedai-atlas"
version = "0.1.0"
description = "Claude-powered intelligence over OMB's 2025 Federal Agency AI Use Case Inventory"
readme = "README.md"
authors = [
    { name = "wschou", email = "wschou@cisco.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.97.0",
    "httpx>=0.28.1",
    "lancedb>=0.30.2",
    "pandas>=3.0.2",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "streamlit>=1.57.0",
    "typer>=0.25.1",
    "voyageai>=0.3.7",
    "plotly>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
fedai = "fedai_atlas.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
